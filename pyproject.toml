[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "Reproducible, next-bar-execution quantitative research workspace"
requires-python = ">=3.10"
dependencies = [
    "freqtrade>=2025.6",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
modern-ml = [
    "einops==0.8.1",
    "huggingface-hub==0.33.1",
    "safetensors==0.6.2",
    "torch==2.12.1",
    "tqdm==4.67.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
quant-validate-data = "quant_research.validate_data:main"
quant-backtest = "quant_research.backtest:main"
quant-dry-run = "quant_research.freqtrade_dry_run:main"
quant-freqtrade-research = "quant_research.freqtrade_research:main"
quant-binance-spot-inventory = "quant_research.binance_spot_archive:main"
quant-binance-spot-payload = "quant_research.binance_spot_payload:main"
quant-binance-spot-revalidate = "quant_research.binance_spot_revalidate:main"
quant-binance-spot-pit-snapshot = "quant_research.binance_spot_pit:main"
quant-binance-spot-announcement-corpus = "quant_research.binance_spot_announcement_corpus:main"
quant-binance-spot-announcement-corpus-v2 = "quant_research.binance_spot_announcement_corpus_v2:main"
quant-binance-spot-announcement-corpus-v3 = "quant_research.binance_spot_announcement_corpus_v3:main"
quant-binance-spot-announcement-corpus-v4 = "quant_research.binance_spot_announcement_corpus_v4:main"
quant-release-tests = "quant_research.release_tests:main"
quant-ddgl-synthetic-smoke = "quant_research.alpha_models.smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
